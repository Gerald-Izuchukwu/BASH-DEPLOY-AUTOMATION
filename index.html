
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padre-X</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .tag {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            border-radius: 20px;
            color: #38bdf8;
            font-size: 13px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 4rem);
            margin-bottom: 15px;
            font-weight: 700;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        footer {
            position: absolute;
            bottom: 25px;
            color: #64748b;
            font-size: 13px;
        }

        footer span {
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="tag">WELCOME</div>

        <h1>Hello, I'm <span>Padre-X.</span></h1>

        <p>
            Building, automating and deploying solutions,
            one step at a time.
        </p>
    </main>

    <footer>
        Crafted by Padre-X
    </footer>

</body>
</html>
